name: Publish to PyPI

# Runs when a version tag such as v0.2.0 is pushed. The tag *is* the version:
# hatch-vcs reads it while building, so there is no version number to edit.
#
# Publishing uses PyPI Trusted Publishing. No API token is stored anywhere:
# PyPI trusts this workflow, in this repository, running in the `pypi` environment.
on:
  push:
    tags:
      - "v*"

# Nothing is granted by default. Each job asks for only what it needs.
permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs needs the full history to see the tags
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Build the sdist and wheel
        run: uv build

      - name: Check this is a clean release version
        run: |
          ls -l dist
          for file in dist/*; do
            case "$file" in
              *dev*|*+*)
                echo "::error::$file is not a clean release version. Was the tag pushed on a commit that is not the latest, or with other changes?"
                exit 1
                ;;
            esac
          done

      - name: Check the wheel contains the package
        run: uv run --no-project python -m zipfile -l dist/*.whl | grep "pyacquisition/__init__.py"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyacquisition
    permissions:
      id-token: write # lets PyPI verify that this workflow is the one uploading
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Publish
        run: uv publish --trusted-publishing always
