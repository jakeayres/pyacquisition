[instruments]
clock = { instrument = "Clock" }
signal = { instrument = "SignalGenerator" }

[instruments.lockin]
instrument = "SR_830"
adapter = "pyvisa"
resource = "GPIB0::8::INSTR"

[measurements]
time = { instrument = "clock", method = "time" }
wave = { instrument = "signal", method = "sine", args = { frequency = 0.2 } }
x = { instrument = "lockin", method = "get_x", unit = "V" }
y = { instrument = "lockin", method = "get_y", unit = "V" }

[rack]
period = 0.2
