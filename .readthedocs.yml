# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# The docs are built with Zensical (zensical.toml), which Read the Docs runs as a
# custom build. See https://docs.readthedocs.com/platform/latest/intro/zensical.html
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    install:
      # Install exactly what uv.lock says, and only the documentation dependencies.
      - uv sync --frozen --only-group docs
    build:
      html:
        - uv run --frozen --no-sync zensical build
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
