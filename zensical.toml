    { "Overview" = "index.md" },
    { "About" = "overview/about.md" },
    { "License" = "overview/license.md" },
    { "Comparison" = "overview/comparison.md" },
    { "Roadmap" = "overview/roadmap.md" },
  ] },
  { "Getting Started" = [
    { "0. Installation" = "getting_started/installation.md" },
    { "1. The Config File" = "getting_started/config_file.md" },
    { "2. The Python API" = "getting_started/python_api.md" },
  ] },
  { "Usage" = [
    { "Overview" = "usage/index.md" },
    { "Instruments" = [
      { "Connect a Real Instrument" = "usage/connect_instrument.md" },
      { "Write a Software Instrument" = "usage/software_instrument.md" },
      { "Write a Hardware Instrument" = "usage/hardware_instrument.md" },
      { "Verifying Hardware" = "dev/verifying_hardware.md" },
    ] },
    { "Data" = [
      { "Tune Your Measurements" = "usage/measurements.md" },
      { "Read Your Data" = "usage/read_data.md" },
      { "Calculate New Columns" = "usage/calculations.md" },
      { "Record Spectra and Traces" = "usage/traces.md" },
    ] },
    { "Tasks" = [
      { "Write a Task" = "usage/write_task.md" },
      { "Sweep a Temperature" = "usage/sweep.md" },
      { "Queue, Pause and Save Tasks" = "usage/queue.md" },
      { "Hold a Temperature with PID" = "usage/pid.md" },
    ] },
    { "The Experiment" = [
      { "Experiment Options" = "usage/setting_up.md" },
      { "Setting Up in the Interface" = "usage/setup_page.md" },
      { "The Interface and the API" = "usage/running.md" },
    ] },
  ] },
  { "Reference" = [
    { "Overview" = "reference/index.md" },
    { "Config File" = "reference/config_file.md" },
    { "Experiment Options" = "reference/experiment_options.md" },
    { "Command Line" = "reference/command_line.md" },
    { "Web API" = "reference/web_api.md" },
    { "The Interface" = "reference/interface.md" },
    { "Data Files" = "reference/data_files.md" },
    { "Adapters" = "reference/adapters.md" },
    { "Calculations" = "reference/calculations.md" },
    { "Verification Specs" = "reference/verification_specs.md" },
    { "Instruments" = [
      { "Overview" = "reference/instruments/overview.md" },
      { "Calculator" = "reference/instruments/calculator.md" },
      { "Clock" = "reference/instruments/clock.md" },
      { "Random Number Generator" = "reference/instruments/random_number_generator.md" },
      { "Signal Generator" = "reference/instruments/signal_generator.md" },
      { "Trace Generator" = "reference/instruments/trace_generator.md" },
      { "Keithley_2000" = "reference/instruments/keithley_2000.md" },
      { "Keithley_6221" = "reference/instruments/keithley_6221.md" },
      { "Lakeshore_340" = "reference/instruments/lakeshore_340.md" },
      { "Lakeshore_350" = "reference/instruments/lakeshore_350.md" },
      { "Mercury IPS" = "reference/instruments/mercury_ips.md" },
      { "SR_830" = "reference/instruments/sr_830.md" },
      { "SR_860" = "reference/instruments/sr_860.md" },
    ] },
    { "Tasks" = [
      { "Overview" = "reference/tasks/overview.md" },
      { "NewFile" = "reference/tasks/new_file.md" },
      { "WaitFor" = "reference/tasks/wait_for.md" },
      { "WaitUntil" = "reference/tasks/wait_until.md" },
      { "Measurements" = "reference/tasks/measurements.md" },
      { "AcquireTrace" = "reference/tasks/acquire_trace.md" },
      { "RampTemperature" = "reference/tasks/ramp_temperature.md" },
      { "PID" = "reference/tasks/pid.md" },
      { "Magnet sweeps" = "reference/tasks/field_sweep.md" },
    ] },
    { "Python API" = [
      { "Experiment" = "reference/python_api/experiment.md" },
      { "Measurement" = "reference/python_api/measurement.md" },
      { "Instrument" = "reference/python_api/instrument.md" },
      { "Task" = "reference/python_api/task.md" },
      { "Task Manager" = "reference/python_api/task_manager.md" },
      { "Rack" = "reference/python_api/rack.md" },
      { "Calculations" = "reference/python_api/calculations.md" },
      { "Traces" = "reference/python_api/traces.md" },
      { "Scribe" = "reference/python_api/scribe.md" },
    ] },
  ] },
]

[project.theme]
variant = "classic" # the Material look. Remove this line for Zensical's newer default design.
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky", # the tabs stay at the top as the page scrolls
  "toc.integrate", # the page's headings go under it in the left menu, not in a right-hand column
]
palette.scheme = "default"
palette.primary = "custom"
palette.accent = "custom" # green and orange are defined in docs/stylesheets/home.css

[project.theme.icon]
repo = "fontawesome/brands/git-alt"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
heading_level = 2
show_root_heading = true
show_root_toc_entry = false
show_root_full_path = false
merge_init_into_class = true
show_symbol_type_heading = true
show_symbol_type_toc = true
show_docstring_examples = true
modernize_annotations = true
show_source = false

# Pages that moved or went send their readers to the page that covers the same ground
# now, so links and bookmarks to them still work: Basic Usage's lessons, which Getting
# Started replaced, and the pages that moved into Reference.
[project.plugins.redirects.redirect_maps]
"usage/introduction.md" = "getting_started/installation.md"
"usage/installation.md" = "getting_started/installation.md"
"usage/first_experiment.md" = "getting_started/config_file.md"
