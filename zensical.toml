[project]
site_name = "PyAcquisition"
site_url = "https://pyacquisition.readthedocs.io"
repo_url = "https://github.com/jakeayres/pyacquisition"
repo_name = "pyacquisition"

extra_css = ["stylesheets/home.css", "stylesheets/showcase.css", "stylesheets/tutorial.css", "stylesheets/instruments.css", "stylesheets/walkthrough.css"]
extra_javascript = ["javascripts/walkthrough.js"] # only acts on a page with a walkthrough (.gs)

nav = [
