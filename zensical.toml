"instruments/lakeshore_340.md" = "reference/instruments/lakeshore_340.md"
"instruments/lakeshore_350.md" = "reference/instruments/lakeshore_350.md"
"instruments/mercury_ips.md" = "reference/instruments/mercury_ips.md"
