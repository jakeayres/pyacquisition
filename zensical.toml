[project]
site_name = "PyAcquisition"
site_url = "https://pyacquisition.readthedocs.io"
repo_url = "https://github.com/jakeayres/pyacquisition"
repo_name = "pyacquisition"

extra_css = ["stylesheets/home.css", "stylesheets/showcase.css", "stylesheets/tutorial.css", "stylesheets/instruments.css"]

nav = [
  { "Overview" = [
    { "Overview" = "index.md" },
    { "About" = "overview/about.md" },
    { "License" = "overview/license.md" },
    { "Comparison" = "overview/comparison.md" },
    { "Roadmap" = "overview/roadmap.md" },
  ] },
  { "Basic Usage" = [
    { "Introduction" = "usage/introduction.md" },
    { "Installation" = "usage/installation.md" },
    { "Setting Up in the Interface" = "usage/setup_page.md" },
    { "1. Your First Experiment" = "usage/first_experiment.md" },
    { "2. A Simulated Rig" = "usage/simulated_rig.md" },
    { "3. Recording Data" = "usage/recording_data.md" },
    { "4. Your First Task" = "usage/first_task.md" },
    { "5. Composing Tasks" = "usage/building_a_sweep.md" },
    { "6. Running Tasks" = "usage/queueing_tasks.md" },
    { "7. Real Instruments" = "usage/real_instruments.md" },
  ] },
  { "Advanced Usage" = [
    { "Overview" = "usage/advanced.md" },
    { "The Experiment" = [
      { "Experiment Options" = "usage/setting_up.md" },
      { "The Interface and the API" = "usage/running.md" },
      { "TOML Configuration" = "usage/toml_config.md" },
    ] },
    { "Instruments and Data" = [
      { "Adding Instruments" = "usage/instruments.md" },
      { "Writing Your Own Instrument" = "usage/custom_instruments.md" },
      { "Measurements and Data Files" = "usage/measurements.md" },
      { "Calculations" = "usage/calculations.md" },
    ] },
    { "Tasks and Procedures" = [
      { "Writing Tasks" = "usage/tasks.md" },
      { "Composing Tasks" = "usage/composing_tasks.md" },
      { "Running Tasks" = "usage/running_tasks.md" },
    ] },
  ] },
  { "Experiment API" = [
    { "Experiment" = "experiment/experiment.md" },
    { "Rack" = "experiment/rack.md" },
    { "Calculations" = "experiment/calculations.md" },
    { "Scribe" = "experiment/scribe.md" },
    { "Task Manager" = "experiment/task_manager.md" },
  ] },
  { "Instruments" = [
    { "Overview" = "instruments/overview.md" },
    { "Clock" = "instruments/clock.md" },
    { "Random Number Generator" = "instruments/random_number_generator.md" },
    { "Signal Generator" = "instruments/signal_generator.md" },
    { "Keithley_2000" = "instruments/keithley_2000.md" },
    { "Keithley_6221" = "instruments/keithley_6221.md" },
    { "Lakeshore_340" = "instruments/lakeshore_340.md" },
    { "Lakeshore_350" = "instruments/lakeshore_350.md" },
    { "Mercury IPS" = "instruments/mercury_ips.md" },
    { "SR_830" = "instruments/sr_830.md" },
    { "SR_860" = "instruments/sr_860.md" },
  ] },
  { "Tasks" = [
    { "Overview" = "tasks/overview.md" },
    { "NewFile" = "tasks/new_file.md" },
    { "WaitFor" = "tasks/wait_for.md" },
    { "WaitUntil" = "tasks/wait_until.md" },
    { "Measurements" = "tasks/measurements.md" },
    { "RampTemperature" = "tasks/ramp_temperature.md" },
    { "PID" = "tasks/pid.md" },
    { "Magnet sweeps" = "tasks/field_sweep.md" },
  ] },
  { "For Developers" = [
    { "Overview" = "dev/overview.md" },
    { "Contributing" = "dev/contributing.md" },
    { "Verifying Hardware" = "dev/verifying_hardware.md" },
  ] },
]

[project.theme]
variant = "classic" # the Material look. Remove this line for Zensical's newer default design.
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.tabs",
  "toc.integrate", # the page's headings go under it in the left menu, not in a right-hand column
]
palette.scheme = "default"
palette.primary = "custom"
palette.accent = "custom" # green and orange are defined in docs/stylesheets/home.css

[project.theme.icon]
repo = "fontawesome/brands/git-alt"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
heading_level = 2
show_root_heading = true
show_root_toc_entry = false
show_root_full_path = false
merge_init_into_class = true
show_symbol_type_heading = true
show_symbol_type_toc = true
show_docstring_examples = true
modernize_annotations = true
show_source = false

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.blocks.caption = {}
pymdownx.blocks.tab.alternate_style = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {} # ++ctrl+k++ as keys
pymdownx.snippets.dedent_subsections = true # a section taken from inside a class is shown without its indent
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
