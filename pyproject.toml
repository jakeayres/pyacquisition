[project]
name = "pyacquisition"
dynamic = ["version"] # taken from the git tag, see [tool.hatch.version]
description = "Python-based data acquisition"
readme = "README.md"
authors = [
    { name = "jakeayres", email = "jake_ayres@hotmail.co.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncio>=3.4.3",
    "fastapi[standard]>=0.141.1",
    "loguru>=0.7.3",
    "pandas>=2.2.3",
    "pyserial>=3.5",
    "pyvisa>=1.15.0",
    "pyvisa-py>=0.8.0",
    "pywebview>=6.2.1",
    "requests>=2.34.2",
    "tomlkit>=0.15.1",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

[project.optional-dependencies]
# Only needed for `pyacquisition build`, which freezes an experiment into a
# standalone application. Install with `uv add pyacquisition[build]`.
build = ["pyinstaller>=6.10"]

[project.urls]
Homepage = "https://github.com/jakeayres/pyacquisition"
Documentation = "https://pyacquisition.readthedocs.io"
Repository = "https://github.com/jakeayres/pyacquisition.git"
Issues = "https://github.com/jakeayres/pyacquisition/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the latest git tag: tagging `v0.2.0` releases 0.2.0.
[tool.hatch.version]
source = "vcs"

# Rebuild the installed project when the git commit or tags change, so that the
# version reported locally stays up to date.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # Ruff's classic defaults, pinned so an upgrade can't change them

[dependency-groups]
dev = [
    "ruff==0.16.9",
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "build"},
]
test = [
    "aiohttp>=3.14.3",
    "matplotlib>=3.11.2",
    "playwright>=1.63.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
]
docs = [
    "zensical>=0.0.62",
    "mkdocstrings[python]>=1.0",
]
# So `pyacquisition build` can be tested in this repo. Not shipped with the package;
# see `[project.optional-dependencies]` for that.
build = [
    "pyinstaller>=6.10",
]


[project.scripts]
pyacquisition = "pyacquisition:main"
