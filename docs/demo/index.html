<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PyAcquisition · Live demo</title>
    <base href="app/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      // The theme, set before the first paint so the page never flashes the
      // wrong one. theme.js takes over from here.
      document.documentElement.dataset.theme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
    <link rel="stylesheet" href="vendor/uplot/uPlot.min.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <style>
      .demo-banner {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 1000;
        padding: 6px 14px;
        border-radius: 999px;
        font: 500 12px/1.4 system-ui, sans-serif;
        color: #f4f6fa;
        background: rgba(10, 15, 26, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        text-decoration: none;
        white-space: nowrap;
      }
      .demo-banner b { color: #ff9f43; font-weight: 600; }
      .demo-banner span { color: #4ade80; }
      .demo-banner:hover span { text-decoration: underline; }
    </style>
    <script src="../stand-in.js"></script>
    <script type="importmap">
      {
        "imports": {
          "preact": "./vendor/preact/preact.module.js",
          "preact/hooks": "./vendor/preact/hooks.module.js",
          "htm": "./vendor/htm/htm.module.js",
          "uplot": "./vendor/uplot/uPlot.esm.js"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
