# Verification spec for Keithley_6221. See pyacquisition/verify/spec.py for the format.
#
# Written from the class and the manual, and not yet run against a real 6221.
# Expect to adjust values and tolerances the first time it is on the bench.
#
# The safe state is: output off. Round trips only run with the output off, and
# every one is followed by turning it off again and checking that it is.

[identity]
contains = ["KEITHLEY", "6221"]

[safe_state]
steps = [{ call = "set_output_state", args = { state = "OFF" } }]
verify = [{ call = "get_output_state", equals = "OFF" }]


# ------------------------------------------------------------------ level 1
# Every get_ method runs. Enum arguments are expanded automatically. These
# rules only cover what cannot be inferred.

[read.get_fresh_reading]
skip = "can only be read once, so reading it here would consume a real reading"

[read.get_fresh_math_reading]
skip = "can only be read once, so reading it here would consume a real reading"

# Readings come from the 2182/2182A nanovoltmeter. List "nanovoltmeter" under
# `capabilities` in the inventory when one is attached.
[read.get_latest_reading]
requires = ["nanovoltmeter"]

[read.get_math_reading]
requires = ["nanovoltmeter"]

[read.get_diffcond_v_zero]
requires = ["nanovoltmeter"]

[read.get_statistic]
requires = ["nanovoltmeter"]

[read.get_buffer_data]
requires = ["nanovoltmeter"]

[read.get_buffer_selected]
args = [{ start = 1, count = 1 }]
requires = ["nanovoltmeter"]

[read.get_display_text_attributes]
note = "the reply format is not documented, so only that it answers is checked"


# ------------------------------------------------------------------ level 2
# set_x is written, get_x read back, and the original restored. Everything is
# reversible unless tagged hazardous.

# ---- the output itself: hazardous, it can put current into a load
[roundtrip.output_state]
hazard = "hazardous"
values = "*"
note = "turns the output ON, with whatever current level is set, into whatever is connected"

[roundtrip.low_to_earth]
hazard = "hazardous"
values = "*"
note = "reconnects output low to earth ground, which changes the grounding of the setup"

[roundtrip.inner_shield]
hazard = "hazardous"
values = "*"
note = "switches the triax inner shield between output low and guard"

[roundtrip.io_pattern_force]
hazard = "hazardous"
values = "*"
note = "forces the digital I/O pattern, which can drive equipment connected to it"

[roundtrip.io_pattern]
hazard = "hazardous"
values = [5, 10]
preconditions = [{ call = "get_io_pattern_force", equals = "OFF" }]
note = "the pattern is only driven when forced; skipped if forcing is already on"

[roundtrip.power_on_setup]
hazard = "hazardous"
values = ["RST", "PRESET"]
note = "changes what the instrument loads at power-up, and stays if it is not restored"

[roundtrip.buffer_size]
hazard = "hazardous"
values = [10, 100]
abs = 0.5
note = "resizing the buffer discards the readings stored in it"

[roundtrip.current_range]
hazard = "hazardous"
values = [2e-3, 2e-6]
rel = 1e-3
preconditions = [
    { call = "get_output_state", equals = "OFF" },
    { call = "get_current", equals = 0.0 },
]
note = "a range smaller than the present level could clamp it, so only run at zero current"

# ---- the source level and compliance: reversible only with the output off
[roundtrip.current]
hazard = "reversible"
values = [1e-9, -1e-9, 0.0]
abs = 1e-12
rel = 1e-3
preconditions = [{ call = "get_output_state", equals = "OFF" }]

[roundtrip.compliance]
hazard = "reversible"
values = [1.0, 5.0]
rel = 1e-3
preconditions = [{ call = "get_output_state", equals = "OFF" }]

[roundtrip.auto_range]
hazard = "reversible"
values = "*"
preconditions = [{ call = "get_output_state", equals = "OFF" }]

[roundtrip.analog_filter]
hazard = "reversible"
values = "*"

[roundtrip.output_response]
hazard = "reversible"
values = "*"

