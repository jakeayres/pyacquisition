# Verification spec for Lakeshore_340. See pyacquisition/verify/spec.py for the format.
#
# Written from the class and the manual (section 9.4), and not yet run against a
# real 340. Expect to adjust values the first time it is on the bench.
#
# The safe state is "nothing to do": the heater outputs are never touched by an
# active check. Anything that changes what a heater or an output does (a loop, its
# setpoint, PID, manual output, heater range, limits, the input a loop controls
# from or its curve) is hazardous, and the examples below are left commented out
# until you choose values for your cryostat.

[identity]
contains = ["LSCI", "MODEL340"]

[safe_state]
steps = []

# Getters that take an input, a loop, an output or a relay are expanded over every
# choice automatically. Inputs C and D are on an option card: without one, their
# checks may fail, which says only that the card isn't there.

[read.get_curve_header]
args = [{ curve_index = 1 }]
note = "curve 1 is always present"

[read.get_curve_point]
args = [{ curve_index = 1, point_index = 1 }]

[read.get_zone]
args = [{ output_channel = "OUTPUT_1", zone = 1 }, { output_channel = "OUTPUT_2", zone = 1 }]

[read.get_display_field]
args = [{ field = 1 }]

[read.get_program_line]
args = [{ program = 1, line = 1 }]
note = "past the end of a program the line is an End command, so an empty program answers too"

[read.get_log_point]
args = [{ point = 1 }]
note = "with no data card, logging's settings are zeros"

[read.get_log_record]
skip = "needs a data card with records on it"

[read.get_heater_range]
args = [{ output_channel = "OUTPUT_1" }]
note = "only loop 1 has a heater"

[read.get_heater_status]
args = [{ output_channel = "OUTPUT_1" }]
note = "only loop 1 has a heater"

[read.get_max_user_current]
note = "needs firmware 01.03.08 or later"

[roundtrip.display_contrast]
hazard = "reversible"
values = [50, 60]

# A setpoint change makes an active control loop heat or cool towards the new
# target, so it is hazardous. Give values that are safe for your setup, and
# consider adding a precondition that the heater is off:
#
# [roundtrip.setpoint]
# hazard = "hazardous"
# values = [10.0]
# abs = 0.01
# select = { output_channel = "*" }
#
# The heater range and the manual output drive the heater directly:
#
# [roundtrip.heater_range]
# hazard = "hazardous"
# values = ["OFF"]
# select = { output_channel = ["OUTPUT_1"] }
#
# [roundtrip.manual_output]
# hazard = "hazardous"
# values = [0.0]
# abs = 0.01
# select = { output_channel = "*" }
